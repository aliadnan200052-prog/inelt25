<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#488A70">
<title>الملزمة · INELT</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/inelt-theme.css">
<style>
/* =====================================================================
   INELT · الملزمة — the study booklet.

   Static reference material only. This page never calls Supabase, never
   creates an attempt and never touches attempts_used; it renders the
   content that ships in /js/data/booklet.js and nothing else.
   ===================================================================== */

.bk-shell { max-width: 820px; margin-inline: auto; padding: var(--sp-7) var(--sp-5) calc(112px + env(safe-area-inset-bottom, 0px)); }

.bk-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-6); }
.bk-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); background: var(--surface-raised);
  font-size: var(--fs-xs); font-weight: 600; color: var(--text-primary);
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.bk-back:hover { background: var(--surface-high); border-color: var(--primary-border); text-decoration: none; }
.bk-back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1); }
.bk-heading { font-size: var(--fs-xl); font-weight: 700; }
.bk-lead { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.8; margin-bottom: var(--sp-6); }
.bk-by { font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: var(--sp-7); }

/* ── Branch picker ── */
.bk-branches { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-4); }
.bk-branch {
  position: relative; padding: var(--sp-6) var(--sp-5); border-radius: var(--r-lg);
  border: 2px solid transparent; text-align: start; cursor: pointer; width: 100%;
  transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.bk-branch[data-k="reading"]      { background: var(--tint-purple); }
.bk-branch[data-k="grammar"]      { background: var(--tint-blue); }
.bk-branch[data-k="functions"]    { background: var(--tint-amber); }
.bk-branch[data-k="conversation"] { background: var(--tint-green); }
.bk-branch:not([disabled]):hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.bk-branch[disabled] { opacity: .62; cursor: default; }
.bk-branch-name { font-size: var(--fs-md); font-weight: 700; margin-bottom: 4px; }
.bk-branch-sub  { font-size: var(--fs-xs); color: var(--text-secondary); }
.bk-soon {
  display: inline-flex; align-items: center; gap: 5px; margin-top: var(--sp-4);
  font-size: 11px; font-weight: 600; color: var(--text-muted);
}
.bk-soon i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); display: block; }

/* ── Search ── */
.bk-search { position: relative; margin-bottom: var(--sp-6); }
.bk-search input {
  width: 100%; padding: 13px 44px 13px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); background: var(--surface-raised);
  font: inherit; font-size: var(--fs-sm); color: var(--text-primary);
}
.bk-search input:focus { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-color: transparent; }
.bk-search svg {
  position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; fill: none; stroke: var(--text-muted); stroke-width: 2.1;
  stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
}

/* ── Part list ── */
.bk-parts { display: grid; gap: var(--sp-3); }
.bk-part {
  display: flex; align-items: center; gap: var(--sp-4); width: 100%; text-align: start;
  padding: var(--sp-5); border-radius: var(--r-lg);
  border: 1px solid var(--border); background: var(--surface-raised); cursor: pointer;
  transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.bk-part:hover { transform: translateY(-2px); border-color: var(--primary-border); box-shadow: var(--shadow-sm); }
.bk-part-n {
  flex: none; width: 40px; height: 40px; border-radius: 13px;
  display: grid; place-items: center;
  background: var(--primary-dim); color: var(--primary-strong);
  font-family: Inter, sans-serif; font-size: var(--fs-sm); font-weight: 700;
}
.bk-part-t { flex: 1; min-width: 0; }
.bk-part-ar { display: block; font-size: var(--fs-sm); font-weight: 700; }
.bk-part-en { display: block; font-family: Inter, sans-serif; font-size: var(--fs-xs); color: var(--text-muted); margin-top: 2px; }
.bk-part-go { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bk-empty { padding: var(--sp-7); text-align: center; color: var(--text-muted); font-size: var(--fs-sm); }

/* ── Lesson body ── */
.bk-part-head { margin-bottom: var(--sp-6); }
.bk-part-head .n { font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 700; color: var(--primary-strong); letter-spacing: 1px; }
.bk-part-head h2 { font-size: var(--fs-lg); font-weight: 700; margin-top: 4px; }
.bk-part-head .en { font-family: Inter, sans-serif; font-size: var(--fs-sm); color: var(--text-muted); margin-top: 2px; }

.bk-lesson { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-raised); margin-bottom: var(--sp-4); overflow: hidden; }
.bk-lesson-head {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: start;
  padding: var(--sp-5); cursor: pointer; background: none; border: 0;
}
.bk-lesson-head:hover { background: var(--surface-high); }
.bk-lesson-head .t { flex: 1; min-width: 0; }
.bk-lesson-head .ar { display: block; font-size: var(--fs-sm); font-weight: 700; }
.bk-lesson-head .en { display: block; font-family: Inter, sans-serif; font-size: var(--fs-xs); color: var(--text-muted); margin-top: 2px; }
.bk-chev { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--text-muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--dur-2) var(--ease); }
.bk-lesson.open .bk-chev { transform: rotate(-90deg); }
.bk-body { display: none; padding: 0 var(--sp-5) var(--sp-5); }
.bk-lesson.open .bk-body { display: block; }

.bk-p { font-size: var(--fs-sm); line-height: 1.95; color: var(--text-secondary); margin-bottom: var(--sp-4); }
.bk-sub { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: var(--sp-5) 0 var(--sp-3); padding-top: var(--sp-4); border-top: 1px dashed var(--border-strong); }
.bk-sub:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.bk-sub .ar { font-size: var(--fs-sm); font-weight: 700; color: var(--primary-deep); }
.bk-sub .en { font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); }

.bk-words { display: flex; direction: ltr; flex-wrap: wrap; gap: 7px; margin-bottom: var(--sp-4); }
.bk-word {
  font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 500;
  padding: 6px 13px; border-radius: var(--r-pill);
  background: var(--primary-dim); color: var(--primary-deep);
  border: 1px solid var(--primary-border);
}

.bk-ex { display: grid; gap: 3px; padding: var(--sp-4); border-radius: var(--r-md); background: var(--surface-high); margin-bottom: var(--sp-3); border-inline-start: 3px solid var(--primary); }
.bk-ex .en { display: block; font-family: Inter, sans-serif; direction: ltr; text-align: left; font-size: var(--fs-sm); font-weight: 600; color: var(--text-primary); }
.bk-ex .ar { display: block; font-size: var(--fs-xs); color: var(--text-secondary); }

.bk-formula {
  font-size: var(--fs-sm); font-weight: 700; text-align: center;
  padding: 12px var(--sp-5); border-radius: var(--r-pill); margin: var(--sp-4) 0;
  background: var(--primary-deep); color: #fff;
}
[data-theme="dark"] .bk-formula { background: var(--primary-strong); color: #08211A; }

.bk-note {
  display: flex; gap: 10px; padding: var(--sp-4); border-radius: var(--r-md);
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  font-size: var(--fs-xs); line-height: 1.85; color: var(--text-primary);
  margin-bottom: var(--sp-4);
}
.bk-note svg { flex: none; width: 16px; height: 16px; margin-top: 2px; fill: none; stroke: var(--accent); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

.bk-table-wrap { overflow-x: auto; margin-bottom: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md); }
.bk-table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.bk-table th { background: var(--primary-dim); color: var(--primary-deep); font-weight: 700; text-align: start; padding: 11px 13px; white-space: nowrap; }
.bk-table td { padding: 11px 13px; border-top: 1px solid var(--border); line-height: 1.7; color: var(--text-secondary); vertical-align: top; }
.bk-table td.en { font-family: Inter, sans-serif; direction: ltr; text-align: left; }

.bk-q { padding: var(--sp-5); border-radius: var(--r-md); background: var(--surface-high); border: 1px solid var(--border); margin-bottom: var(--sp-4); }
.bk-q-t { font-family: Inter, sans-serif; direction: ltr; text-align: left; font-size: var(--fs-sm); font-weight: 600; margin-bottom: var(--sp-4); line-height: 1.7; }
.bk-opts { display: grid; gap: 7px; }
.bk-opt {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: start;
  padding: 11px 13px; border-radius: var(--r-md);
  border: 1.5px solid var(--border); background: var(--surface-raised); cursor: pointer;
  font-family: Inter, sans-serif; direction: ltr; font-size: var(--fs-xs);
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.bk-opt:hover { border-color: var(--primary-border); }
.bk-opt .k { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-high); font-size: 11px; font-weight: 700; color: var(--text-muted); }
.bk-opt.right { border-color: var(--success); background: var(--success-dim); }
.bk-opt.right .k { background: var(--success); color: #fff; }
.bk-opt.wrong { border-color: var(--danger); background: var(--danger-dim); }
.bk-opt.wrong .k { background: var(--danger); color: #fff; }
.bk-q.done .bk-opt { cursor: default; }

.bk-nav { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-7); }
.bk-nav button { padding: 13px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface-raised); font: inherit; font-size: var(--fs-xs); font-weight: 600; color: var(--text-primary); cursor: pointer; }
.bk-nav button:hover:not(:disabled) { background: var(--surface-high); border-color: var(--primary-border); }
.bk-nav button:disabled { opacity: .4; cursor: default; }

.hidden { display: none !important; }

@media (max-width: 560px) {
  .bk-branches { grid-template-columns: 1fr; }
  .bk-nav { grid-template-columns: 1fr; }
}

/* ── The same tab bar as the dashboard, so it never disappears mid-task ── */
.pr-tabs {
  position: fixed; z-index: 60;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  inset-inline: 16px; max-width: 420px; margin-inline: auto;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 7px; border-radius: 24px;
  background: rgba(255,255,255,.84);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 2px 6px rgba(18,44,33,.06), 0 16px 34px -12px rgba(18,44,33,.3);
}
[data-theme="dark"] .pr-tabs { background: rgba(26,35,30,.88); border-color: rgba(255,255,255,.1); }
.pr-tab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 8px; border-radius: 18px; color: var(--text-muted); text-decoration: none; }
.pr-tab svg { width: 21px; height: 21px; }
.pr-tab span { font-size: 10.5px; font-weight: 600; }
.pr-tab.is-on { background: var(--primary-dim); color: var(--primary-strong); }
.pr-tab.is-on span { font-weight: 700; }
</style>
</head>
<body>

<div class="bk-shell">

  <div class="bk-top">
    <h1 class="bk-heading" id="bkTitle">الملزمة</h1>
    <a class="bk-back" id="bkBack" href="/">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>رجوع</span>
    </a>
  </div>

  <!-- ① الفروع -->
  <div id="bkBranches">
    <p class="bk-lead">اختر الفرع الذي تريد مراجعته. المحتوى للقراءة فقط — لا مؤقّت ولا محاولات.</p>
    <div class="bk-branches" id="bkBranchList"></div>
  </div>

  <!-- ② قائمة الأجزاء -->
  <div id="bkParts" class="hidden">
    <p class="bk-by" id="bkBy"></p>
    <div class="bk-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
      <input id="bkSearch" type="search" placeholder="ابحث في الملزمة…" autocomplete="off">
    </div>
    <div class="bk-parts" id="bkPartList"></div>
  </div>

  <!-- ③ جزء واحد -->
  <div id="bkPart" class="hidden">
    <div class="bk-part-head" id="bkPartHead"></div>
    <div id="bkLessons"></div>
    <div class="bk-nav">
      <button id="bkPrev" type="button">الجزء السابق</button>
      <button id="bkNext" type="button">الجزء التالي</button>
    </div>
  </div>

</div>

<script src="/js/data/booklet.js"></script>
<script src="/js/page/booklet.js"></script>

<nav class="pr-tabs" aria-label="التنقل">
  <a class="pr-tab" href="/" data-go="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2V20a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 20z"/><path d="M9.2 21.6v-7.4h5.6v7.4"/></svg>
    <span>الرئيسية</span>
  </a>
  <a class="pr-tab" href="/practice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3h7A1.5 1.5 0 0 1 17 4.5V5h1.5A2.5 2.5 0 0 1 21 7.5v11A2.5 2.5 0 0 1 18.5 21h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H7v-.5A1.5 1.5 0 0 1 8.5 3z"/><path d="m8.6 13.4 2 2 4.8-4.8"/></svg>
    <span>تدرّب</span>
  </a>
  <span class="pr-tab is-on" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <span>ادرس</span>
  </span>
</nav>

<script src="/js/page/practice-tabs.js"></script>
<script src="/js/sw-register.js"></script>
</body>
</html>
