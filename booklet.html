<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#488A70">
<title>الملزمة · INELT</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/inelt-theme.css">
<style>
/* =====================================================================
   INELT · الملزمة

   A reading surface, not a settings list: a cover, parts that look like
   chapters, and a continuous typeset lesson with its own index.

   Static content only. No Supabase call, no attempt, no attempts_used.
   Where a student stopped is a per-browser convenience kept in
   localStorage; nothing here is shared or read back by the server.
   ===================================================================== */

:root { --bk-accent: var(--sec-grammar); --bk-tint: var(--tint-blue); }

/* ── reading progress, pinned to the very top ── */
.bk-progress { position: fixed; inset-inline: 0; top: 0; height: 3px; z-index: 70; background: transparent; }
.bk-progress i { display: block; height: 100%; width: 0; background: var(--bk-accent); transition: width .12s linear; }

/* ── sticky bar ── */
.bk-bar {
  position: sticky; top: 0; z-index: 55;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 13px var(--sp-5); margin-inline: calc(var(--sp-5) * -1);
  background: color-mix(in srgb, var(--surface-base) 97%, transparent);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.bk-bar-t { flex: 1; min-width: 0; }
.bk-bar-t .a { display: block; font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-bar-t .b { display: block; font-family: Inter, sans-serif; font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.bk-icon {
  flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid var(--border-strong); background: var(--surface-raised); cursor: pointer; padding: 0;
}
.bk-icon:hover { background: var(--surface-high); border-color: var(--primary-border); }
.bk-icon svg { width: 16px; height: 16px; fill: none; stroke: var(--text-primary); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bk-icon.back svg { transform: scaleX(-1); }

.bk-shell { max-width: 880px; margin-inline: auto; padding: 0 var(--sp-5) calc(118px + env(safe-area-inset-bottom, 0px)); }
.bk-view { padding-top: var(--sp-7); }

/* ── ① cover of the whole booklet ── */
.bk-hero {
  position: relative; overflow: hidden; border-radius: var(--r-xl);
  padding: var(--sp-7) var(--sp-6); margin-bottom: var(--sp-7);
  background: linear-gradient(145deg, var(--primary-deep), var(--green-900));
  color: #fff;
}
.bk-hero::after {
  content: ''; position: absolute; inset-inline-end: -40px; top: -50px;
  width: 210px; height: 210px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.14), transparent 70%);
}
.bk-hero-k { font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.4px; opacity: .72; }
.bk-hero h1 { font-size: var(--fs-xxl); font-weight: 700; margin: 8px 0 6px; }
.bk-hero p { font-size: var(--fs-xs); opacity: .82; line-height: 1.8; }
.bk-stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: var(--sp-6); border-radius: var(--r-md); overflow: hidden; background: rgba(255,255,255,.16); }
.bk-stat { padding: 13px 6px; text-align: center; background: rgba(255,255,255,.08); }
.bk-stat b { display: block; font-family: Inter, sans-serif; font-size: var(--fs-lg); font-weight: 700; }
.bk-stat span { display: block; font-size: 11px; opacity: .78; margin-top: 2px; }

.bk-resume {
  display: flex; align-items: center; gap: var(--sp-4); width: 100%; text-align: start;
  padding: var(--sp-5); border-radius: var(--r-lg); margin-bottom: var(--sp-6);
  border: 1.5px solid var(--primary-border); background: var(--primary-dim); cursor: pointer;
}
.bk-resume:hover { background: var(--primary-soft); }
.bk-resume .ic { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--primary); }
.bk-resume .ic svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1); }
.bk-resume .t { flex: 1; min-width: 0; }
.bk-resume .t b { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--primary-deep); }
.bk-resume .t span { display: block; font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 2px; }

/* ── branch cards ── */
.bk-label { font-size: var(--fs-xs); font-weight: 700; color: var(--text-muted); letter-spacing: .4px; margin-bottom: var(--sp-4); }
.bk-branches { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-4); }
.bk-branch {
  direction: rtl;
  position: relative; overflow: hidden; width: 100%; text-align: start; cursor: pointer;
  padding: var(--sp-6) var(--sp-5); border-radius: var(--r-lg); border: 2px solid transparent;
  transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.bk-branch[data-k="grammar"]      { background: var(--tint-blue);   --c: var(--sec-grammar); }
.bk-branch[data-k="reading"]      { background: var(--tint-purple); --c: var(--sec-reading); }
.bk-branch[data-k="functions"]    { background: var(--tint-amber);  --c: var(--sec-functions); }
.bk-branch[data-k="conversation"] { background: var(--tint-green);  --c: var(--sec-conversation); }
.bk-branch:not([disabled]):hover { transform: translateY(-3px); border-color: var(--c); box-shadow: var(--shadow-md); }
.bk-branch[disabled] { opacity: .58; cursor: default; }
.bk-branch .ic { display: block; width: 34px; height: 34px; margin-bottom: var(--sp-4); }
.bk-branch .ic svg { width: 100%; height: 100%; fill: none; stroke: var(--c); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bk-branch .nm { display: block; font-size: var(--fs-md); font-weight: 700; }
.bk-branch .en { display: block; font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.bk-branch .meta { display: flex; direction: rtl; align-items: center; gap: 6px; margin-top: var(--sp-5); font-size: 11px; font-weight: 600; color: var(--c); }
.bk-branch[disabled] .meta { color: var(--text-muted); }
.bk-branch .meta i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: block; }
.bk-ring { position: absolute; inset-inline-end: var(--sp-5); top: var(--sp-5); width: 40px; height: 40px; }
.bk-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.bk-ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.bk-ring .tr { stroke: rgba(0,0,0,.09); }
.bk-ring .pr { stroke: var(--c); transition: stroke-dashoffset .5s var(--ease); }
.bk-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: Inter, sans-serif; font-size: 10px; font-weight: 700; color: var(--c); }

/* ── ② part index ── */
.bk-search { position: relative; margin-bottom: var(--sp-5); }
.bk-search input {
  width: 100%; padding: 13px 44px 13px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); background: var(--surface-raised);
  font: inherit; font-size: var(--fs-sm); color: var(--text-primary);
}
.bk-search input:focus { outline: 2px solid var(--focus-ring); outline-offset: 1px; border-color: transparent; }
.bk-search svg { position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; fill: none; stroke: var(--text-muted); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

.bk-parts { display: grid; gap: var(--sp-4); }
.bk-part {
  direction: rtl;
  position: relative; display: grid; grid-template-columns: 54px 1fr 16px; align-items: center;
  gap: var(--sp-4); width: 100%; text-align: start; cursor: pointer;
  padding: var(--sp-5); border-radius: var(--r-lg);
  border: 1px solid var(--border); background: var(--surface-raised); overflow: hidden;
  transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.bk-part::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--c); opacity: .9; }
.bk-part:hover { transform: translateY(-2px); border-color: var(--c); box-shadow: var(--shadow-sm); }
.bk-part .n {
  width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center;
  background: var(--t); color: var(--c); font-family: Inter, sans-serif; font-size: var(--fs-lg); font-weight: 700;
}
.bk-part .ar { display: block; font-size: var(--fs-sm); font-weight: 700; }
.bk-part .en { display: block; font-family: Inter, sans-serif; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.bk-part .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.bk-tag { font-size: 10.5px; font-weight: 600; color: var(--text-secondary); background: var(--surface-high); border-radius: 6px; padding: 3px 7px; }
.bk-part .go { width: 16px; height: 16px; fill: none; stroke: var(--text-muted); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bk-part.read .n { background: var(--success-dim); color: var(--success); }
.bk-done { position: absolute; inset-inline-end: 40px; top: var(--sp-5); width: 17px; height: 17px; fill: none; stroke: var(--success); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none; }
.bk-part.read .bk-done { display: block; }
.bk-empty { padding: var(--sp-8); text-align: center; color: var(--text-muted); font-size: var(--fs-sm); }

/* ── ③ reading a part ── */
.bk-ph { padding: var(--sp-6) 0 var(--sp-5); border-bottom: 2px solid var(--bk-tint); margin-bottom: var(--sp-6); }
.bk-ph .k { display: inline-flex; align-items: center; gap: 7px; font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--bk-accent); background: var(--bk-tint); border-radius: var(--r-pill); padding: 5px 12px; }
.bk-ph h2 { font-size: var(--fs-xxl); font-weight: 700; margin: var(--sp-4) 0 4px; line-height: 1.3; }
.bk-ph .en { font-family: Inter, sans-serif; font-size: var(--fs-sm); color: var(--text-muted); }

/* lesson index, sticky under the bar */
.bk-jump {
  position: sticky; top: 65px; z-index: 40; display: flex; gap: 7px; overflow-x: auto;
  padding: 11px 0; margin-bottom: var(--sp-5);
  background: var(--surface-base); border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.bk-jump::-webkit-scrollbar { display: none; }
.bk-jump button {
  flex: none; padding: 7px 14px; border-radius: var(--r-pill); cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface-raised);
  font: inherit; font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap;
}
.bk-jump button.on { background: var(--bk-accent); border-color: var(--bk-accent); color: #fff; }

.bk-lesson { margin-bottom: var(--sp-8); scroll-margin-top: 118px; }
.bk-lh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: var(--sp-5); padding-inline-start: 13px; border-inline-start: 4px solid var(--bk-accent); }
.bk-lh h3 { font-size: var(--fs-lg); font-weight: 700; }
.bk-lh .en { font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); }

.bk-p { font-size: var(--fs-sm); line-height: 2.05; color: var(--text-secondary); margin-bottom: var(--sp-5); }
.bk-sub { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin: var(--sp-6) 0 var(--sp-4); }
.bk-sub::before { content: ''; width: 18px; height: 2px; border-radius: 2px; background: var(--bk-accent); opacity: .6; }
.bk-sub .ar { font-size: var(--fs-md); font-weight: 700; color: var(--text-primary); }
.bk-sub .en { font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 600; color: var(--bk-accent); }

.bk-words { display: flex; direction: ltr; flex-wrap: wrap; gap: 7px; margin-bottom: var(--sp-5); }
.bk-word { font-family: Inter, sans-serif; font-size: var(--fs-xs); font-weight: 500; padding: 7px 14px; border-radius: var(--r-pill); background: var(--bk-tint); color: var(--text-primary); }

.bk-exs { display: grid; gap: 9px; margin-bottom: var(--sp-5); }
.bk-ex { position: relative; padding: var(--sp-4) var(--sp-5); border-radius: var(--r-md); background: var(--surface-high); border-inline-start: 3px solid var(--bk-accent); }
.bk-ex .en { display: block; font-family: Inter, sans-serif; direction: ltr; text-align: left; font-size: var(--fs-sm); font-weight: 600; line-height: 1.6; color: var(--text-primary); }
.bk-ex .ar { display: block; font-size: var(--fs-xs); color: var(--text-muted); margin-top: 5px; }

.bk-formula {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: var(--fs-sm); font-weight: 700; text-align: center;
  padding: 15px var(--sp-5); border-radius: var(--r-lg); margin: var(--sp-5) 0;
  background: var(--primary-deep); color: #fff; box-shadow: var(--shadow-sm);
}
.bk-formula::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.55); flex: none; }
[data-theme="dark"] .bk-formula { background: var(--primary-strong); color: #08211A; }

.bk-note { display: flex; gap: 11px; padding: var(--sp-5); border-radius: var(--r-lg); background: var(--accent-dim); border: 1px solid var(--accent-border); font-size: var(--fs-xs); line-height: 1.95; color: var(--text-primary); margin-bottom: var(--sp-5); }
.bk-note svg { flex: none; width: 17px; height: 17px; margin-top: 3px; fill: none; stroke: var(--accent); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

.bk-table-wrap { overflow-x: auto; margin-bottom: var(--sp-5); border: 1px solid var(--border); border-radius: var(--r-lg); }
.bk-table { width: 100%; min-width: 460px; border-collapse: collapse; font-size: var(--fs-xs); }
.bk-table th { background: var(--bk-accent); color: #fff; font-weight: 700; text-align: start; padding: 12px 14px; white-space: nowrap; }
.bk-table td { padding: 12px 14px; border-top: 1px solid var(--border); line-height: 1.75; color: var(--text-secondary); vertical-align: top; }
.bk-table tbody tr:nth-child(even) { background: var(--surface-high); }
.bk-table td.en { font-family: Inter, sans-serif; direction: ltr; text-align: left; }

.bk-q { padding: var(--sp-5); border-radius: var(--r-lg); background: var(--surface-raised); border: 1px solid var(--border-strong); margin-bottom: var(--sp-4); }
.bk-q-k { display: inline-block; font-family: Inter, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: var(--bk-accent); margin-bottom: 9px; }
.bk-q-t { font-family: Inter, sans-serif; direction: ltr; text-align: left; font-size: var(--fs-sm); font-weight: 600; margin-bottom: var(--sp-4); line-height: 1.75; }
.bk-opts { display: grid; gap: 7px; }
.bk-opt {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: start; cursor: pointer;
  padding: 11px 13px; border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface-base);
  font-family: Inter, sans-serif; direction: ltr; font-size: var(--fs-xs); line-height: 1.5;
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.bk-opt:hover { border-color: var(--bk-accent); }
.bk-opt .k { flex: none; width: 23px; height: 23px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-high); font-size: 11px; font-weight: 700; color: var(--text-muted); }
.bk-opt.right { border-color: var(--success); background: var(--success-dim); }
.bk-opt.right .k { background: var(--success); color: #fff; }
.bk-opt.wrong { border-color: var(--danger); background: var(--danger-dim); }
.bk-opt.wrong .k { background: var(--danger); color: #fff; }
.bk-q.done .bk-opt { cursor: default; }

.bk-foot { border-top: 1px solid var(--border); padding-top: var(--sp-6); margin-top: var(--sp-8); }
.bk-mark {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; cursor: pointer;
  padding: 15px; border-radius: var(--r-lg); border: 1.5px solid var(--primary-border);
  background: var(--primary-dim); color: var(--primary-deep);
  font: inherit; font-size: var(--fs-sm); font-weight: 700;
}
.bk-mark:hover { background: var(--primary-soft); }
.bk-mark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.bk-mark.on { background: var(--success-dim); border-color: var(--success); color: var(--success); }
.bk-nav { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-4); }
.bk-nav button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 13px; border-radius: var(--r-lg); border: 1px solid var(--border-strong); background: var(--surface-raised); font: inherit; font-size: var(--fs-xs); font-weight: 600; color: var(--text-primary); cursor: pointer; }
.bk-nav button:hover:not(:disabled) { background: var(--surface-high); border-color: var(--primary-border); }
.bk-nav button:disabled { opacity: .35; cursor: default; }
.bk-nav svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.hidden { display: none !important; }

@media (max-width: 560px) {
  .bk-branches { grid-template-columns: 1fr; }
  .bk-nav { grid-template-columns: 1fr; }
  .bk-ph h2 { font-size: var(--fs-xl); }
  .bk-part { grid-template-columns: 46px 1fr 14px; }
  .bk-part .n { width: 46px; height: 46px; border-radius: 14px; font-size: var(--fs-md); }
}

/* ── the dashboard's tab bar ── */
.pr-tabs {
  position: fixed; z-index: 60; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  inset-inline: 16px; max-width: 420px; margin-inline: auto;
  display: grid; grid-template-columns: repeat(3, 1fr); padding: 7px; border-radius: 24px;
  background: rgba(255,255,255,.84);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 2px 6px rgba(18,44,33,.06), 0 16px 34px -12px rgba(18,44,33,.3);
}
[data-theme="dark"] .pr-tabs { background: rgba(26,35,30,.88); border-color: rgba(255,255,255,.1); }
.pr-tab { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 8px; border-radius: 18px; color: var(--text-muted); text-decoration: none; }
.pr-tab svg { width: 21px; height: 21px; }
.pr-tab span { font-size: 10.5px; font-weight: 600; }
.pr-tab.is-on { background: var(--primary-dim); color: var(--primary-strong); }
.pr-tab.is-on span { font-weight: 700; }
</style>
</head>
<body>

<div class="bk-progress"><i id="bkProg"></i></div>

<div class="bk-shell">

  <div class="bk-bar">
    <button class="bk-icon back" id="bkBack" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="bk-bar-t"><span class="a" id="bkT1">الملزمة</span><span class="b" id="bkT2">INELT · Study</span></span>
    <button class="bk-icon" id="bkTop" type="button" aria-label="أعلى الصفحة">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
  </div>

  <!-- ① الفروع -->
  <div class="bk-view" id="vBranches">
    <div class="bk-hero">
      <div class="bk-hero-k">INELT · BOOKLET</div>
      <h1>الملزمة</h1>
      <p id="bkHeroSub"></p>
      <div class="bk-stats" id="bkHeroStats"></div>
    </div>
    <div class="bk-label">الفروع</div>
    <div class="bk-branches" id="bkBranchList"></div>
  </div>

  <!-- ② فهرس الأجزاء -->
  <div class="bk-view hidden" id="vIndex">
    <button class="bk-resume hidden" id="bkResume" type="button">
      <span class="ic"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span>
      <span class="t"><b>تابع من حيث توقفت</b><span id="bkResumeT"></span></span>
    </button>
    <div class="bk-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/></svg>
      <input id="bkSearch" type="search" placeholder="ابحث عن جزء أو درس…" autocomplete="off">
    </div>
    <div class="bk-parts" id="bkPartList"></div>
  </div>

  <!-- ③ القراءة -->
  <div class="bk-view hidden" id="vRead">
    <div class="bk-ph" id="bkPh"></div>
    <div class="bk-jump" id="bkJump"></div>
