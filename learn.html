<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#488A70">
<title>المسار · INELT</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="stylesheet" href="/css/inelt-theme.css">
<style>
/* =====================================================================
   INELT · المسار — the teaching track.

   Short sittings rather than long ones: a handful of questions, each
   marked the moment it is answered, with the explanation on the same
   card. Nothing here touches the exam, an attempt, or attempts_used.
   ===================================================================== */

.ln-shell { max-width: 760px; margin-inline: auto; padding: var(--sp-7) var(--sp-5) calc(112px + env(safe-area-inset-bottom, 0px)); }
.ln-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-6); }
.ln-heading { font-size: var(--fs-xl); font-weight: 700; }
.ln-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--border-strong); background: var(--surface-raised);
  font-size: var(--fs-xs); font-weight: 600; color: var(--text-primary);
}
.ln-back:hover { background: var(--surface-high); text-decoration: none; }
.ln-back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1); }

/* ── today ── */
.ln-today {
  position: relative; overflow: hidden;
  border-radius: var(--r-xl); padding: var(--sp-7);
  background: linear-gradient(200deg, var(--primary-deep) 0%, var(--primary) 100%);
  color: var(--on-primary); margin-bottom: var(--sp-7);
}
.ln-today-k { font-size: var(--fs-2xs); font-weight: 700; opacity: .8; letter-spacing: .04em; }
.ln-today-t { margin-top: 6px; font-size: var(--fs-lg); font-weight: 700; }
.ln-today-s { margin-top: 6px; font-size: var(--fs-xs); line-height: 1.8; opacity: .9; }
.ln-today-btn {
  margin-top: var(--sp-6); width: 100%;
  padding: 14px; border: 0; border-radius: var(--r-pill);
  background: var(--surface-raised); color: var(--primary-deep);
  font-family: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer;
  transition: transform var(--dur-2) var(--ease);
}
.ln-today-btn:hover { transform: translateY(-1px); }
.ln-today-btn:disabled { opacity: .6; cursor: default; transform: none; }

/* ── the numbers ── */
.ln-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-7); }
.ln-stat {
  padding: var(--sp-5) var(--sp-4); border-radius: var(--r-lg);
  border: 1px solid var(--border); background: var(--surface-raised); text-align: center;
}
.ln-stat-n { font-family: var(--font-en); font-size: var(--fs-xl); font-weight: 700; color: var(--primary-deep); }
.ln-stat-l { margin-top: 3px; font-size: var(--fs-2xs); color: var(--text-secondary); }

/* ── the units ── */
.ln-group-t { font-size: var(--fs-sm); font-weight: 700; margin: var(--sp-7) 0 var(--sp-4); }
.ln-units { display: flex; flex-direction: column; gap: var(--sp-3); }
.ln-unit {
  direction: rtl; display: flex; align-items: center; gap: var(--sp-4);
  width: 100%; padding: var(--sp-4) var(--sp-5); text-align: start; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface-raised); box-shadow: var(--shadow-xs);
  transition: transform var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.ln-unit:hover { transform: translateY(-2px); border-color: var(--primary-border); background: var(--tint-green); }
.ln-unit-ic {
  flex-shrink: 0; display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: var(--r-sm);
  background: var(--tint-green); color: var(--primary-deep);
}
.ln-unit[data-kind="phrases"]   .ln-unit-ic { background: var(--tint-blue);   color: var(--sec-grammar); }
.ln-unit[data-kind="idioms"]    .ln-unit-ic { background: var(--tint-purple); color: var(--sec-reading); }
.ln-unit[data-kind="functions"] .ln-unit-ic { background: var(--tint-amber);  color: var(--sec-functions); }
.ln-unit-ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ln-unit-main { flex: 1; min-width: 0; }
.ln-unit-n { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); }
.ln-unit-s { display: block; margin-top: 3px; font-size: var(--fs-2xs); color: var(--text-secondary); }
.ln-unit-bar { margin-top: 7px; height: 5px; border-radius: var(--r-pill); background: var(--surface-high); overflow: hidden; }
.ln-unit-fill { height: 100%; border-radius: var(--r-pill); background: var(--primary); transition: width var(--dur-4) var(--ease); }
.ln-unit-go { flex-shrink: 0; font-size: var(--fs-2xs); font-weight: 700; color: var(--text-secondary); }

/* ── reading the lessons again ── */
.ln-unit-pair { display: flex; flex-direction: column; }
.ln-unit-pair .ln-unit { border-end-start-radius: 0; border-end-end-radius: 0; }
.ln-unit-pair .ln-unit:hover { transform: none; }   /* half a card lifting looks broken */
.ln-unit-read {
  direction: rtl; display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  width: 100%; padding: var(--sp-3) var(--sp-5); cursor: pointer;
  border: 1px solid var(--border); border-top: 0;
  border-radius: 0 0 var(--r-lg) var(--r-lg);
  background: var(--surface-base); color: var(--text-secondary);
  font-size: var(--fs-2xs); font-weight: 700;
  transition: background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.ln-unit-read:hover { background: var(--tint-green); color: var(--primary-deep); }
.ln-unit-read svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.ln-lessons-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-5); }
.ln-lessons-t { font-size: var(--fs-md); font-weight: 700; color: var(--text-primary); }
.ln-lessons-back {
  flex-shrink: 0; padding: var(--sp-2) var(--sp-4); cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-raised); color: var(--text-secondary);
  font-size: var(--fs-2xs); font-weight: 700;
}
.ln-lessons-back:hover { border-color: var(--primary-border); color: var(--primary-deep); }
.ln-lessons { display: flex; flex-direction: column; gap: var(--sp-3); }
.ln-lesson {
  direction: rtl; display: flex; align-items: center; gap: var(--sp-4);
  width: 100%; padding: var(--sp-4) var(--sp-5); text-align: start; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface-raised); box-shadow: var(--shadow-xs);
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.ln-lesson:hover { border-color: var(--primary-border); background: var(--tint-green); }
.ln-lesson-i {
  flex-shrink: 0; display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-sm);
  background: var(--tint-green); color: var(--primary-deep);
  font-family: var(--font-en); font-size: var(--fs-2xs); font-weight: 700;
}
.ln-lesson-main { flex: 1; min-width: 0; }
.ln-lesson-n { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary); }
.ln-lesson-s { display: block; margin-top: 2px; font-size: var(--fs-2xs); color: var(--text-secondary); }
.ln-lesson-go { flex-shrink: 0; display: grid; place-items: center; color: var(--text-secondary); }
.ln-lesson-go svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ln-lesson:hover .ln-lesson-go { color: var(--primary-deep); }

/* ── a question ── */
.ln-bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
.ln-pos { font-size: var(--fs-2xs); color: var(--text-secondary); }
.ln-score { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; font-size: var(--fs-xs); font-weight: 700; color: var(--primary-deep); }
.ln-track { height: 9px; border-radius: var(--r-pill); background: var(--surface-high); overflow: hidden; margin-bottom: var(--sp-6); }
.ln-fill { height: 100%; border-radius: var(--r-pill); background: linear-gradient(90deg, var(--primary-deep), var(--primary)); transition: width var(--dur-4) var(--ease); }

.ln-card {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-sm);
  padding: var(--sp-7); margin-bottom: var(--sp-5);
  animation: rise-in var(--dur-3) var(--ease-entrance) both;
}
.ln-ask { font-size: var(--fs-2xs); font-weight: 700; color: var(--text-secondary); margin-bottom: var(--sp-4); }
.ln-prompt { font-size: var(--fs-xl); font-weight: 700; line-height: 1.7; color: var(--text-primary); margin-bottom: var(--sp-6); }
.ln-prompt.en { font-family: var(--font-en); direction: ltr; text-align: left; }
.ln-prompt.ar { font-family: var(--font-ar); direction: rtl; text-align: right; }

.ln-opts { display: flex; flex-direction: column; gap: var(--sp-3); }
.ln-opt {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 13px var(--sp-5); border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface-raised);
  box-shadow: var(--shadow-xs); cursor: pointer; text-align: start;
  font-family: inherit; font-size: var(--fs-sm); color: var(--text-primary);
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
.ln-opt.en { font-family: var(--font-en); direction: ltr; text-align: left; }
.ln-opt.ar { font-family: var(--font-ar); direction: rtl; text-align: right; }
.ln-opt:hover { border-color: var(--primary-border); background: var(--tint-green); }
.ln-opts.done .ln-opt { cursor: default; }
/* Once answered, hovering must not undo the marking. The pointer is
   naturally left on the option just tapped — and on a touch screen that
   hover state sticks — so without :not() the wrong answer a learner
   picked is the one option that loses its colour. */
.ln-opts.done .ln-opt:not(.right):not(.wrong):hover { border-color: var(--border); background: var(--surface-raised); }
.ln-opt.right { border-color: var(--success); background: var(--success-dim); }
.ln-opt.wrong { border-color: var(--danger); background: var(--danger-dim, rgba(185,49,49,.08)); }

/* ── بطاقة التعليم ──
   The first meeting with an entry: what it is, what it means, and one
   sentence it lives in. No sound and no picture — the exam is read, and
   an emoji beside a word teaches nothing about using it. */
.ln-new {
  display: inline-block; margin-bottom: var(--sp-5);
  padding: 5px 14px; border-radius: var(--r-pill);
  background: var(--tint-green); color: var(--primary-deep);
  font-size: var(--fs-2xs); font-weight: 700;
}
.ln-teach-w {
  font-size: var(--fs-2xl); font-weight: 700; line-height: 1.4;
  color: var(--text-primary); word-break: break-word;
}
.ln-teach-w.en { font-family: var(--font-en); direction: ltr; text-align: left; }
.ln-teach-ar { margin-top: var(--sp-3); font-size: var(--fs-lg); font-weight: 600; color: var(--primary-deep); }
.ln-teach-kind { margin-top: 6px; font-size: var(--fs-2xs); color: var(--text-secondary); }
.ln-teach-when { margin-top: var(--sp-6); padding-top: var(--sp-5); border-top: 1px solid var(--border); }
.ln-teach-when-k { font-size: var(--fs-2xs); font-weight: 700; color: var(--text-secondary); }
.ln-teach-when-v { margin-top: 5px; font-size: var(--fs-sm); line-height: 1.9; color: var(--text-primary); }
.ln-teach-when-v.en { font-family: var(--font-en); direction: ltr; text-align: left; }
.ln-teach-ex { margin-top: var(--sp-6); padding-top: var(--sp-5); border-top: 1px solid var(--border); }
.ln-teach-ex-en { font-family: var(--font-en); direction: ltr; text-align: left; font-size: var(--fs-md); line-height: 1.8; color: var(--text-primary); }
.ln-teach-ex-ar { margin-top: 6px; font-size: var(--fs-sm); line-height: 1.8; color: var(--text-secondary); }

/* ── درس القواعد ──
   The booklet's own blocks, rendered as they were written. Arabic rules
   read right to left; English examples, formulas and word lists read left
   to right, and each says so rather than inheriting and guessing. */
.ln-g-title { font-size: var(--fs-xl); font-weight: 700; color: var(--text-primary); }
.ln-g-en { margin-top: 4px; font-family: var(--font-en); direction: ltr; text-align: left; font-size: var(--fs-xs); color: var(--text-secondary); }
.ln-g-body { margin-top: var(--sp-6); }
.ln-g-p { margin: 0 0 var(--sp-5); font-size: var(--fs-sm); line-height: 2.05; color: var(--text-primary); }
.ln-g-sub {
  display: flex; align-items: baseline; gap: var(--sp-3);
  margin: var(--sp-6) 0 var(--sp-4); padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm); font-weight: 700; color: var(--primary-deep);
}
.ln-g-sub .en { font-family: var(--font-en); direction: ltr; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-secondary); }
.ln-g-formula {
  margin: var(--sp-4) 0; padding: 11px var(--sp-5);
  border-radius: var(--r-md); background: var(--primary-deep); color: var(--on-primary);
  font-size: var(--fs-xs); font-weight: 600; text-align: center;
}
.ln-g-note {
  margin: var(--sp-5) 0; padding: var(--sp-4) var(--sp-5);
  border-inline-start: 3px solid var(--sec-functions);
  border-radius: var(--r-sm); background: var(--tint-amber);
  font-size: var(--fs-xs); line-height: 1.95; color: var(--text-primary);
}
.ln-g-words { display: flex; flex-wrap: wrap; gap: 7px; direction: ltr; margin: var(--sp-4) 0; }
.ln-g-words span {
  padding: 5px 12px; border-radius: var(--r-pill);
  background: var(--surface-high); font-family: var(--font-en);
  font-size: var(--fs-2xs); font-weight: 600; color: var(--text-primary);
}
.ln-g-ex {
  margin: var(--sp-3) 0; padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-overlay);
}
.ln-g-ex .en { display: block; font-family: var(--font-en); direction: ltr; text-align: left; font-size: var(--fs-sm); line-height: 1.75; color: var(--text-primary); }
.ln-g-ex .ar { display: block; margin-top: 4px; font-size: var(--fs-2xs); color: var(--text-secondary); }
.ln-g-tablewrap { margin: var(--sp-5) 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ln-g-table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: var(--fs-2xs); }
.ln-g-table th, .ln-g-table td {
  padding: 9px 11px; border: 1px solid var(--border); text-align: start;
}
.ln-g-table th { background: var(--tint-green); font-weight: 700; color: var(--primary-deep); }
.ln-g-table td { color: var(--text-primary); }

/* ── التوصيل ──
   Two columns, tapped into pairs. A paired chip stays on screen rather
   than vanishing: the learner should be able to look back over what they
   have matched so far, and a card that empties as you work gives nothing
   to check against. */
.ln-match { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.ln-match-col { display: flex; flex-direction: column; gap: var(--sp-3); }
.ln-chip {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 52px; padding: 10px var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-raised); box-shadow: var(--shadow-xs);
  font-family: inherit; font-size: var(--fs-sm); font-weight: 600;
  color: var(--text-primary); cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease),
              opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.ln-chip.en { font-family: var(--font-en); direction: ltr; }
.ln-chip.ar { font-family: var(--font-ar); direction: rtl; }
.ln-chip:hover:not(.tied) { border-color: var(--primary-border); background: var(--tint-green); }
.ln-chip.sel { border-color: var(--primary); background: var(--tint-green); transform: scale(.98); }
.ln-chip.tied {
  border-color: var(--success); background: var(--success-dim);
  color: var(--text-secondary); opacity: .62; cursor: default;
}
.ln-chip.miss { border-color: var(--danger); background: var(--danger-dim); }
.ln-match-left { margin-top: var(--sp-4); font-size: var(--fs-2xs); color: var(--text-secondary); text-align: center; }
@media (prefers-reduced-motion: reduce) { .ln-chip { transition: none; } .ln-chip.sel { transform: none; } }

.ln-input {
  width: 100%; padding: 14px var(--sp-5);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface-raised); color: var(--text-primary);
  font-family: var(--font-en); direction: ltr; text-align: left;
  font-size: var(--fs-lg); font-weight: 600;
}
.ln-input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.ln-input.right { border-color: var(--success); background: var(--success-dim); }
.ln-input.wrong { border-color: var(--danger); }
.ln-hint { margin-top: var(--sp-3); font-family: var(--font-en); direction: ltr; text-align: left; font-size: var(--fs-xs); color: var(--text-secondary); }

.ln-tell {
  margin-top: var(--sp-5); padding: var(--sp-5);
  border-radius: var(--r-md); background: var(--surface-overlay);
  border: 1px solid var(--border);
  font-size: var(--fs-sm); line-height: 1.9; color: var(--text-primary);
}
.ln-tell b { color: var(--primary-deep); }
.ln-tell .en { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; }
.ln-tell-lit { display: block; margin-top: 6px; font-size: var(--fs-2xs); color: var(--text-secondary); }

.ln-actions { display: flex; gap: var(--sp-3); }
.ln-actions .btn { flex: 1; }

/* ── the end of a sitting ── */
.ln-done { text-align: center; padding: var(--sp-8) var(--sp-6); }
.ln-done-n { font-family: var(--font-en); font-size: var(--fs-3xl, 2rem); font-weight: 700; color: var(--primary-deep); }
.ln-done-s { margin-top: var(--sp-3); font-size: var(--fs-sm); line-height: 1.9; color: var(--text-secondary); }
.ln-done-acts { display: flex; flex-wrap: wrap; gap: var(--sp-3); justify-content: center; margin-top: var(--sp-6); }

@media (prefers-reduced-motion: reduce) {
  .ln-card { animation: none; }
  .ln-unit:hover { transform: none; }
  .ln-today-btn:hover { transform: none; }
}
</style>
</head>
<body>

<div class="ln-shell">

  <div class="ln-top">
    <h1 class="ln-heading">المسار</h1>
    <a class="ln-back" href="/">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>رجوع</span>
    </a>
  </div>

  <!-- ── the path ── -->
  <div id="path">
    <div class="ln-today">
      <div class="ln-today-k">جلسة اليوم</div>
      <div class="ln-today-t" id="todayT">—</div>
      <div class="ln-today-s" id="todayS">—</div>
      <button type="button" class="ln-today-btn" id="startToday">ابدأ</button>
    </div>

    <div class="ln-stats">
      <div class="ln-stat"><div class="ln-stat-n" id="statKnown">0</div><div class="ln-stat-l">تعرفها</div></div>
      <div class="ln-stat"><div class="ln-stat-n" id="statLearning">0</div><div class="ln-stat-l">تحت التعلّم</div></div>
      <div class="ln-stat"><div class="ln-stat-n" id="statDue">0</div><div class="ln-stat-l">للمراجعة</div></div>
    </div>

    <div id="groups"></div>
  </div>

  <!-- ── the lessons of one part, to read again ── -->
  <div id="lessons" class="hidden">
    <div class="ln-lessons-top">
      <span class="ln-lessons-t" id="lessonsT">—</span>
      <button type="button" class="ln-lessons-back" id="lessonsBack">المسار</button>
    </div>
    <div class="ln-lessons" id="lessonsList"></div>
  </div>

  <!-- ── a sitting ── -->
  <div id="sitting" class="hidden">
    <div class="ln-bar-row">
      <span class="ln-pos" id="lnPos">—</span>
      <span class="ln-score" id="lnScore">0 / 0</span>
    </div>
    <div class="ln-track"><div class="ln-fill" id="lnFill" style="width:0%"></div></div>
    <div class="ln-card" id="lnCard"></div>
    <div class="ln-actions">
