<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Estimate how many English word families you understand. A frequency-based, sampled vocabulary-size assessment with an uncertainty range and transparent methodology.">
<meta name="theme-color" content="#FAF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<title>Vocabulary Size Estimator</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vocab.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="brand" type="button" data-nav="home" aria-label="Vocabulary Size Estimator — home">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-text">Vocabulary Size Estimator</span>
    </button>
    <nav class="topnav" aria-label="Main">
      <button type="button" class="link-btn" data-nav="history">Progress</button>
      <button type="button" class="link-btn" data-nav="method">Method</button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Colour theme: automatic" title="Colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <!-- Every screen is rendered by js/vocab/app.js into this container. -->
  <section id="view" aria-live="polite"></section>
  <noscript><p class="notice serious">This assessment needs JavaScript to run. Everything runs in your browser; nothing is sent to a server.</p></noscript>
</main>

<footer class="footer wrap">
  <p>Runs entirely in your browser. Results are stored only on this device (localStorage). Not a validated or standardised test — see <button type="button" class="link-inline" data-nav="method">Method &amp; limitations</button>.</p>
</footer>

<div class="tooltip" id="tooltip" role="status" hidden></div>

<script src="js/vocab/bank.js"></script>
<script src="js/vocab/engine.js"></script>
<script src="js/vocab/store.js"></script>
<script src="js/vocab/charts.js"></script>
<script src="js/vocab/app.js"></script>
</body>
</html>
