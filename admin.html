<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>INELT Admin</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/inelt-theme.css">
<style>
/* =====================================================================
   INELT · Admin — design system v2 ("Quiet Academic")
   Tokens/primitives come from /css/inelt-theme.css. This page stays
   English/LTR; only its appearance changed.
   ===================================================================== */

body {
  font-family: var(--font-en);
  line-height: 1.6;
  padding: 0;
}

.admin-shell {
  max-width: 1120px;
  margin-inline: auto;
  padding: var(--sp-8) var(--sp-6) var(--sp-10);
}

/* ── Page header ───────────────────────────────────────────────────── */
.admin-header {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding-bottom: var(--sp-6);
  margin-bottom: var(--sp-7);
  border-bottom: 1px solid var(--border);
  animation: rise-in var(--dur-3) var(--ease-entrance) both;
}
.admin-mark {
  width: 40px; height: 40px;
  flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--primary-strong);
  color: #fff;
  font-weight: 700;
  font-size: var(--fs-xs);
  letter-spacing: .06em;
}
h1 {
  font-size: var(--fs-xl);
  font-weight: 700;
  letter-spacing: -.01em;
}
.muted {
  font-size: var(--fs-xs);
  color: var(--text-secondary);
}

/* Access check — a live state rather than a blank page. */
#whoami:not(:empty) {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 3px;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  background: var(--surface-high);
  border: 1px solid var(--border);
  font-size: var(--fs-2xs);
  color: var(--text-secondary);
  animation: whoami-pulse 1.6s var(--ease) infinite;
}
@keyframes whoami-pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

/* ── Stat cards ────────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-7);
}
.stat {
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border-radius: var(--r-md);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-xs);
  transition: border-color var(--dur-2) var(--ease),
              transform var(--dur-2) var(--ease),
              box-shadow var(--dur-2) var(--ease);
}
.stat:hover {
  border-color: var(--primary-border);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}
.stat .n {
  font-size: var(--fs-3xl);
  font-weight: 700;
  line-height: 1.05;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.stat .l {
  margin-top: 4px;
  font-size: var(--fs-2xs);
  color: var(--text-secondary);
}
/* First card is the total — mark it as the primary figure. */
.stat:first-child { border-color: var(--primary-border); background: var(--primary-soft); }
.stat:first-child .n { color: var(--primary-strong); }

/* ── Sections ──────────────────────────────────────────────────────── */
section {
  padding: var(--sp-6);
  margin-bottom: var(--sp-6);
  border-radius: var(--r-lg);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-xs);
}
section h2 {
  font-size: var(--fs-md);
  font-weight: 700;
  margin-bottom: var(--sp-3);
}
section > .muted { display: block; margin-bottom: var(--sp-5); max-width: 68ch; }

/* ── Controls ──────────────────────────────────────────────────────── */
button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: var(--primary-strong);
  color: var(--on-primary);
  font-family: var(--font-en);
  font-size: var(--fs-xs);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-2) var(--ease),
              border-color var(--dur-2) var(--ease),
              color var(--dur-2) var(--ease),
              transform var(--dur-1) var(--ease);
}
button:hover { background: var(--primary-deep); transform: translateY(-1px); }
button:active { transform: translateY(0) scale(.98); }

button.secondary {
  background: var(--surface-raised);
  border-color: var(--border-strong);
  color: var(--text-primary);
}
button.secondary:hover {
  background: var(--surface-high);
  border-color: var(--primary-border);
  color: var(--primary-strong);
}

button.danger {
  background: var(--danger-dim);
  border-color: var(--danger-border);
  color: var(--danger);
}
button.danger:hover { background: var(--danger); border-color: transparent; color: #fff; }

select,
input[type=text],
textarea {
  padding: 8px 11px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-raised);
  color: var(--text-primary);
  font-family: var(--font-en);
  font-size: var(--fs-xs);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
select:focus,
input[type=text]:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-dim);
}

input[type=file] {
  max-width: 100%;
  padding: 10px;
  border-radius: var(--r-sm);
  border: 1px dashed var(--border-strong);
  background: var(--surface-overlay);
  color: var(--text-secondary);
  font-size: var(--fs-xs);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease);
}
input[type=file]:hover { border-color: var(--primary-border); background: var(--primary-dim); }
input[type=file]::file-selector-button {
  margin-inline-end: 10px;
  padding: 6px 13px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-xs);
  background: var(--surface-raised);
  color: var(--text-primary);
  font-family: var(--font-en);
  font-size: var(--fs-2xs);
  font-weight: 600;
  cursor: pointer;
}

/* ── Import row + result ───────────────────────────────────────────── */
.import-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-4);
}
#importResult:not(:empty) {
  margin-top: var(--sp-5);
  padding: var(--sp-4) var(--sp-5);
  border-radius: var(--r-sm);
  background: var(--surface-overlay);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  line-height: 1.8;
  color: var(--text-primary);
  white-space: pre-wrap;
  animation: rise-in var(--dur-3) var(--ease-entrance) both;
}

/* ── Filter bar ────────────────────────────────────────────────────── */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  align-items: center;
  margin-bottom: var(--sp-5);
}
.filter-bar .spacer { flex: 1; }

/* ── Table ─────────────────────────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
}
table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  font-size: var(--fs-xs);
}
th, td {
  text-align: left;
  padding: 11px var(--sp-4);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
th {
  position: sticky;
  top: 0;
  background: var(--surface-high);
  color: var(--text-secondary);
  font-weight: 700;
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: .04em;
  white-space: nowrap;
}
tbody tr { transition: background-color var(--dur-1) var(--ease); }
tbody tr:hover { background: var(--surface-overlay); }
tbody tr:last-child td { border-bottom: none; }
td { color: var(--text-primary); line-height: 1.7; }

.row-actions {
  display: flex;
  gap: 6px;
  white-space: nowrap;
}
.row-actions button { padding: 6px 11px; font-size: var(--fs-2xs); }

.pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  background: var(--primary-dim);
  border: 1px solid var(--primary-border);
  color: var(--primary-strong);
  font-size: var(--fs-2xs);
  font-weight: 600;
  white-space: nowrap;
}

/* ── Pagination ────────────────────────────────────────────────────── */
.pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
}
#pageLabel { margin-inline-start: auto; font-variant-numeric: tabular-nums; }

/* ── Responsive ────────────────────────────────────────────────────── */
@media (max-width: 720px) {
  .admin-shell { padding: var(--sp-6) var(--sp-4) var(--sp-9); }
  section { padding: var(--sp-5); border-radius: var(--r-md); }
  .grid { grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
  .stat { padding: var(--sp-4); }
  .stat .n { font-size: var(--fs-2xl); }
  #pageLabel { margin-inline-start: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="admin-shell">

<header class="admin-header">
  <div class="admin-mark">IN</div>
  <div>
    <h1>INELT — Admin Dashboard</h1>
    <p class="muted" id="whoami">checking access…</p>
  </div>
</header>

<div id="app" style="display:none">
  <div class="grid" id="statsGrid"></div>

  <section>
    <h2>Bulk import questions</h2>
    <p class="muted">Accepts .xlsx, .csv, or .json. Duplicates (same section + question + options) are skipped automatically.</p>
    <div class="import-row">
      <input type="file" id="fileInput" accept=".xlsx,.csv,.json">
      <button onclick="doImport()">Upload &amp; Import</button>
    </div>
    <div id="importResult"></div>
  </section>

  <section>
    <h2>Question bank</h2>
    <div class="filter-bar">
      <select id="sectionFilter" onchange="loadList()">
        <option value="">All sections</option>
        <option>Reading Comprehension</option>
        <option>Grammar</option>
        <option>Functions</option>
        <option>Conversation</option>
      </select>
      <span class="spacer"></span>
      <button class="secondary" onclick="ExamAPI.adminExportUrl('json')">Export JSON</button>
      <button class="secondary" onclick="ExamAPI.adminExportUrl('csv')">Export CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Section</th><th>Question</th><th>Options</th><th>Correct</th><th></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="secondary" onclick="changePage(-1)">← Prev</button>
      <button class="secondary" onclick="changePage(1)">Next →</button>
      <span class="muted" id="pageLabel"></span>
    </div>
  </section>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
let page = 1;

async function init() {
  const ok = await ExamAPI.requireAdminSession();
  if (!ok) return;
  try {
    await loadStats();
    document.getElementById('whoami').textContent = '';
    document.getElementById('app').style.display = 'block';
    loadList();
  } catch (e) {
    document.getElementById('whoami').textContent = 'Access denied — this account is not an admin.';
  }
}

async function loadStats() {
  const { total, by_section } = await ExamAPI.adminCount();
  const g = document.getElementById('statsGrid');
  g.innerHTML = `<div class="stat"><div class="n">${total}</div><div class="l">Total questions</div></div>` +
    Object.entries(by_section).map(([s, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${s}</div></div>`).join('');
}

async function doImport() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return alert('Choose a file first');
  const box = document.getElementById('importResult');
  box.textContent = 'Importing…';
  try {
    const r = await ExamAPI.adminImport(file);
    box.textContent = `✅ Imported: ${r.inserted}   ⏭ Duplicates skipped: ${r.duplicates}   ⚠️ Invalid rows: ${r.invalid_count}` +
      (r.invalid_details?.length ? '\n\n' + r.invalid_details.map(d => `Row ${d.row}: ${d.reason}`).join('\n') : '');
    await loadStats();
    loadList();
  } catch (e) {
    box.textContent = 'Error: ' + e.message;
  }
}

async function loadList() {
  const section = document.getElementById('sectionFilter').value;
  const { rows, total } = await ExamAPI.adminList({ section, page, pageSize: 20 });
  document.getElementById('pageLabel').textContent = `Page ${page} · ${total} total`;
  document.getElementById('tableBody').innerHTML = rows.map(q => `
    <tr>
      <td><span class="pill">${q.section}</span></td>
      <td style="max-width:320px">${escapeHtml(q.question)}</td>
      <td>${q.options.map((o,i)=>`${i===q.correct_answer?'✅':'▫️'} ${escapeHtml(o)}`).join('<br>')}</td>
      <td>${q.correct_answer + 1}</td>
      <td class="row-actions">
        <button class="secondary" onclick="editQuestion('${q.id}')">Edit</button>
        <button class="danger" onclick="deleteQuestion('${q.id}')">Delete</button>
      </td>
    </tr>`).join('');
}

function changePage(delta) {
  page = Math.max(1, page + delta);
  loadList();
}

async function deleteQuestion(id) {
  if (!confirm('Delete this question permanently?')) return;
  await ExamAPI.adminDelete(id);
  loadStats();
  loadList();
}

async function editQuestion(id) {
  const newQuestion = prompt('New question text (leave blank to cancel):');
  if (!newQuestion) return;
  await ExamAPI.adminUpdate(id, { question: newQuestion });
  loadList();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

init();
</script>
</body>
</html>
